; Build & flash:  cd firmware && pio run -t upload
; (Arduino IDE: open cc1101_nmap/cc1101_nmap.ino, board "ESP32 Dev Module",
;  install "SmartRC-CC1101-Driver-Lib" from the Library Manager.)
[platformio]
src_dir = cc1101_nmap

[env:evilcrow-rf-v2]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = lsatan/SmartRC-CC1101-Driver-Lib@2.5.7
monitor_speed = 115200
board_build.f_flash = 40000000L
board_build.flash_mode = dio
